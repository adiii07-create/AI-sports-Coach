kind = "web"
previewPath = "/"
title = "AI Sports Coach"
description = "An accessible sports training assistant that guides athletes through structured drills and returns evidence-based movement feedback, starting with badminton footwork analysis."
version = "1.0.0"
id = "artifacts/ai-sports-coach"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18439

[services.development]
run = "pnpm --filter @workspace/ai-sports-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-sports-coach", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-sports-coach/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18439"
BASE_PATH = "/"
